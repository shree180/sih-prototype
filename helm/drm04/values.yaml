# Default values for DRM04 Helm chart
# Override with --values values-prod.yaml or --set key=value

global:
  # Global settings applied to all components
  environment: production
  domain: drm04.example.com
  imageRegistry: ghcr.io
  imagePullSecrets:
    - name: ghcr-secret

  # Common labels
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: drm04

# Web application (Next.js)
web:
  enabled: true
  replicaCount: 3
  image:
    repository: your-org/drm04-web
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "20m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    hosts:
      - host: drm04.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: drm04-tls
        hosts:
          - drm04.example.com
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    - name: NODE_ENV
      value: production
    - name: NEXT_TELEMETRY_DISABLED
      value: "1"
  envFrom:
    - configMapRef:
        name: drm04-config
    - secretRef:
        name: drm04-secrets
  probes:
    liveness:
      path: /api/health/live
      initialDelaySeconds: 15
      periodSeconds: 30
    readiness:
      path: /api/health/ready
      initialDelaySeconds: 10
      periodSeconds: 15
    startup:
      path: /api/health/live
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 30
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - drm04-web
            topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: drm04-web

# AI Service (FastAPI)
ai:
  enabled: true
  replicaCount: 2
  image:
    repository: your-org/drm04-ai
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    hosts:
      - host: ai.drm04.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: drm04-ai-tls
        hosts:
          - ai.drm04.example.com
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    - name: ENVIRONMENT
      value: production
    - name: PYTHONUNBUFFERED
      value: "1"
  envFrom:
    - configMapRef:
        name: drm04-config
    - secretRef:
        name: drm04-secrets
  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 30
      periodSeconds: 30
    readiness:
      path: /health/ready
      initialDelaySeconds: 15
      periodSeconds: 15
    startup:
      path: /health/live
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 60
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - drm04-ai
            topologyKey: kubernetes.io/hostname

# PostgreSQL with PostGIS
postgresql:
  enabled: true
  image:
    repository: postgis/postgis
    tag: 16-3.4
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: fast-ssd
    size: 50Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  env:
    - name: POSTGRES_DB
      value: drm04
    - name: POSTGRES_USER
      value: drm04
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5

# Nginx Ingress (if not using cluster ingress)
nginx:
  enabled: false
  # Configuration would go here if using internal nginx

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRules:
    enabled: true

# ConfigMap for application configuration
configMap:
  enabled: true
  data:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    ENABLE_AI_ASSESSMENT: "true"
    ENABLE_FACE_REDACTION: "true"
    ENABLE_OFFLINE_MODE: "false"
    ENABLE_MULTILINGUAL: "false"
    AI_PROVIDER: openai
    AI_MODEL: gpt-4o
    AI_MODEL_VERSION: "1.0"
    CONFIDENCE_THRESHOLD: "0.60"
    NEXT_PUBLIC_STORAGE_ORIGINALS: report-originals
    NEXT_PUBLIC_STORAGE_REDACTED: report-redacted
    LOG_LEVEL: info
    LOG_FORMAT: json

# Secrets (values should be overridden in values-prod.yaml)
secrets:
  enabled: true
  data: {}
  # DATABASE_URL: "postgresql://..."
  # SUPABASE_URL: "https://..."
  # NEXT_PUBLIC_SUPABASE_ANON_KEY: "..."
  # SUPABASE_SERVICE_ROLE_KEY: "..."
  # AI_SERVICE_KEY: "..."
  # AI_API_KEY: "..."
  # NEXTAUTH_SECRET: "..."
  # NEXTAUTH_URL: "https://..."
  # NEXT_PUBLIC_MAP_STYLE_URL: "https://..."
  # SENTRY_DSN: "..."

# Network Policies
networkPolicies:
  enabled: true

# Service Accounts
serviceAccounts:
  web:
    create: true
    name: drm04-web
  ai:
    create: true
    name: drm04-ai

# Pod Security Policies (if using PSP)
podSecurityPolicy:
  enabled: false

# RBAC
rbac:
  enabled: true