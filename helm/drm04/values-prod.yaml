# Production values for DRM04 Helm chart
# Use with: helm install drm04 ./helm/drm04 -f values-prod.yaml

global:
  environment: production
  domain: drm04.example.com
  imageRegistry: ghcr.io
  imagePullSecrets:
    - name: ghcr-secret

web:
  replicaCount: 5
  image:
    tag: "v1.0.0"
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi
  autoscaling:
    minReplicas: 5
    maxReplicas: 30

ai:
  replicaCount: 3
  image:
    tag: "v1.0.0"
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 8000m
      memory: 16Gi
  autoscaling:
    minReplicas: 3
    maxReplicas: 15

postgresql:
  persistence:
    size: 100Gi
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

monitoring:
  enabled: true

networkPolicies:
  enabled: true