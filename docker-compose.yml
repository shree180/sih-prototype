version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: drm04-postgres
    environment:
      POSTGRES_DB: drm04
      POSTGRES_USER: drm04
      POSTGRES_PASSWORD: drm04
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drm04 -d drm04"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: drm04-web
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://drm04:drm04@postgres:5432/drm04
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:3000
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=local-anon-key
      - SUPABASE_SERVICE_ROLE_KEY=local-service-key
      - AI_SERVICE_URL=http://ai:8000
      - AI_SERVICE_KEY=
      - NEXT_PUBLIC_MAP_STYLE_URL=
      - NEXT_PUBLIC_STORAGE_ORIGINALS=report-originals
      - NEXT_PUBLIC_STORAGE_REDACTED=report-redacted
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    restart: unless-stopped

  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: drm04-ai
    environment:
      - AI_PROVIDER=demo
      - AI_API_KEY=
      - AI_SERVICE_KEY=${AI_SERVICE_KEY:-}
      - AI_MODEL=demo-vision-1
      - AI_MODEL_VERSION=1.0
      - CONFIDENCE_THRESHOLD=0.60
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: drm04-network
