apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: drm04

resources:
  - ../../base/namespace.yaml
  - ../../base/configmap.yaml
  - ../../base/secret.yaml
  - ../../base/web-deployment.yaml
  - ../../base/web-service-ingress.yaml
  - ../../base/ai-deployment.yaml
  - ../../base/ai-service.yaml
  - ../../base/postgres-statefulset.yaml
  - ../../base/hpa.yaml
  - ../../base/network-policies.yaml

commonLabels:
  environment: staging

images:
  - name: ghcr.io/your-org/drm04-web
    newTag: staging-latest
  - name: ghcr.io/your-org/drm04-ai
    newTag: staging-latest

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: drm04-web
      spec:
        replicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: drm04-ai
      spec:
        replicas: 1

configMapGenerator:
  - name: drm04-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - ENABLE_OFFLINE_MODE=true