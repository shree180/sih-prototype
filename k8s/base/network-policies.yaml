apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drm04-web-network-policy
  namespace: drm04
  labels:
    app: drm04-web
    app.kubernetes.io/name: drm04-web
    app.kubernetes.io/part-of: drm04
spec:
  podSelector:
    matchLabels:
      app: drm04-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from NGINX Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    # Allow from AI service for callbacks
    - from:
        - podSelector:
            matchLabels:
              app: drm04-ai
      ports:
        - protocol: TCP
          port: 3000
    # Allow from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              name: drm04-monitoring
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow to AI service
    - to:
        - podSelector:
            matchLabels:
              app: drm04-ai
      ports:
        - protocol: TCP
          port: 8000
    # Allow to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow to Supabase (external)
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # Allow to external AI providers
    - to: []
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drm04-ai-network-policy
  namespace: drm04
  labels:
    app: drm04-ai
    app.kubernetes.io/name: drm04-ai
    app.kubernetes.io/part-of: drm04
spec:
  podSelector:
    matchLabels:
      app: drm04-ai
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from web service
    - from:
        - podSelector:
            matchLabels:
              app: drm04-web
      ports:
        - protocol: TCP
          port: 8000
    # Allow from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              name: drm04-monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow to external AI providers (OpenAI, Gemini)
    - to: []
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: drm04
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: drm04
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from web service
    - from:
        - podSelector:
            matchLabels:
              app: drm04-web
      ports:
        - protocol: TCP
          port: 5432
    # Allow from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              name: drm04-monitoring
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53