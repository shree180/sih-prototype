apiVersion: v1
kind: ConfigMap
metadata:
  name: drm04-config
  namespace: drm04
  labels:
    app.kubernetes.io/name: drm04
    app.kubernetes.io/part-of: drm04
data:
  # Application configuration
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

  # Feature flags
  ENABLE_AI_ASSESSMENT: "true"
  ENABLE_FACE_REDACTION: "true"
  ENABLE_OFFLINE_MODE: "false"
  ENABLE_MULTILINGUAL: "false"

  # AI Service configuration
  AI_PROVIDER: "openai"
  AI_MODEL: "gpt-4o"
  AI_MODEL_VERSION: "1.0"
  CONFIDENCE_THRESHOLD: "0.60"

  # Storage buckets
  NEXT_PUBLIC_STORAGE_ORIGINALS: "report-originals"
  NEXT_PUBLIC_STORAGE_REDACTED: "report-redacted"

  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"